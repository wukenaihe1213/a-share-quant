name: A-share full-market scan

on:
  workflow_dispatch:
    inputs:
      max_history_stocks:
        description: "Maximum number of diversified multi-signal stocks for detailed daily-K-line calculation"
        required: true
        default: "300"
        type: string
      min_amount_cny:
        description: "Minimum 20-day average turnover in CNY"
        required: true
        default: "50000000"
        type: string
      delay_seconds:
        description: "Pause between per-stock history requests"
        required: true
        default: "1.2"
        type: string
  # 14:10 China Standard Time, Monday-Friday. The ChatGPT task verifies
  # the A-share trading calendar and rejects stale or non-trading-day data.
  schedule:
    - cron: "10 6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: a-share-market-scan
  cancel-in-progress: false

jobs:
  market-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTHONUTF8: "1"
        run: |
          python -m unittest discover -s tests -v

      - name: Run full-market scan
        env:
          PYTHONUTF8: "1"
        run: |
          python -m src.market_scan \
            --max-history-stocks "${{ github.event.inputs.max_history_stocks || '300' }}" \
            --min-amount-cny "${{ github.event.inputs.min_amount_cny || '50000000' }}" \
            --delay-seconds "${{ github.event.inputs.delay_seconds || '1.2' }}" \
            --output-candidates 50

      - name: Publish machine-readable results for ChatGPT
        if: success()
        env:
          PYTHONUTF8: "1"
        run: |
          git pull --rebase origin main
          mkdir -p scan-results/latest
          cp data/market_scan.json scan-results/latest/market_scan.json
          cp data/candidates.csv scan-results/latest/candidates.csv
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("data/market_scan.json").read_text(encoding="utf-8"))
          manifest = {
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "event_name": os.environ.get("GITHUB_EVENT_NAME"),
              "source_commit": os.environ.get("GITHUB_SHA"),
              "collected_at": result.get("collected_at"),
              "scan_status": result.get("status"),
              "candidate_count": result.get("coverage", {}).get("candidate_count"),
              "history_success": result.get("coverage", {}).get("history_success"),
              "history_requested": result.get("coverage", {}).get("history_requested"),
          }
          Path("scan-results/latest/manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan-results/latest/market_scan.json scan-results/latest/candidates.csv scan-results/latest/manifest.json
          if git diff --cached --quiet; then
            echo "No scan-result changes to publish."
          else
            git commit -m "Publish A-share scan results"
            git push origin HEAD:main
          fi

      - name: Upload scan output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a-share-market-scan
          path: |
            data/market_scan.json
            data/candidates.csv
          if-no-files-found: warn
          retention-days: 30
