name: A-share full-market scan

on:
  workflow_dispatch:
    inputs:
      max_history_stocks:
        description: "Maximum number of diversified multi-signal stocks for detailed daily-K-line calculation"
        required: true
        default: "300"
        type: string
      min_amount_cny:
        description: "Minimum 20-day average turnover in CNY"
        required: true
        default: "50000000"
        type: string
      delay_seconds:
        description: "Pause between per-stock history requests"
        required: true
        default: "1.2"
        type: string
  # Primary: 14:00 China time. Backup: 14:05 if today's successful result is not published.
  # GitHub schedule events are best-effort; the backup and publication guard make the scan idempotent.
  schedule:
    - cron: "0 6 * * 1-5"
    - cron: "5 6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: a-share-market-scan
  cancel-in-progress: false

jobs:
  market-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Record trigger and check today's publication
        id: preflight
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule || 'manual' }}
        run: |
          set -euo pipefail
          echo "skip_scan=false" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT_NAME"
          echo "schedule=$SCHEDULE_EXPR"
          echo "triggered_at_utc=$(date -u --iso-8601=seconds)"
          echo "triggered_at_china=$(TZ=Asia/Shanghai date --iso-8601=seconds)"

          # Manual runs always execute. Scheduled primary/backup runs share an idempotency guard.
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "Manual dispatch: duplicate-scan guard is bypassed."
            exit 0
          fi

          # Read the current main branch, not the possibly stale SHA attached to a queued schedule event.
          if ! git fetch --no-tags --depth=1 origin main; then
            echo "Cannot fetch latest main for duplicate check; continuing with scan to avoid missing today's run."
            exit 0
          fi
          if ! git show origin/main:scan-results/latest/manifest.json > "$RUNNER_TEMP/latest-manifest.json" 2>/dev/null; then
            echo "No previously published manifest; this scheduled run will execute."
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          manifest_path = Path(os.environ["RUNNER_TEMP"]) / "latest-manifest.json"
          try:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"Cannot read prior manifest ({exc}); this scheduled run will execute.")
              raise SystemExit(0)

          collected_at = str(manifest.get("collected_at") or "")
          collected_date = collected_at[:10]
          collected_clock = collected_at[11:16] if len(collected_at) >= 16 else ""
          today = datetime.now(ZoneInfo("Asia/Shanghai")).date().isoformat()
          status = manifest.get("scan_status")
          # An early manual smoke run must not suppress the scheduled afternoon scan.
          if collected_date == today and collected_clock >= "13:55" and status == "ok":
              print(
                  f"Today's successful afternoon scan is already published "
                  f"(run_id={manifest.get('run_id')}, collected_at={collected_at}); skipping duplicate."
              )
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("skip_scan=true\n")
          else:
              print(
                  f"No successful scan for {today} found "
                  f"(latest_date={collected_date or 'unknown'}, latest_time={collected_clock or 'unknown'}, "
                  f"status={status}); executing scan."
              )
          PY

      - name: Set up Python
        if: steps.preflight.outputs.skip_scan != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.preflight.outputs.skip_scan != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        if: steps.preflight.outputs.skip_scan != 'true'
        env:
          PYTHONUTF8: "1"
        run: |
          python -m unittest discover -s tests -v

      - name: Run full-market scan
        if: steps.preflight.outputs.skip_scan != 'true'
        env:
          PYTHONUTF8: "1"
        run: |
          python -m src.market_scan \
            --max-history-stocks "${{ github.event.inputs.max_history_stocks || '300' }}" \
            --min-amount-cny "${{ github.event.inputs.min_amount_cny || '50000000' }}" \
            --delay-seconds "${{ github.event.inputs.delay_seconds || '1.2' }}" \
            --output-candidates 50

      - name: Publish machine-readable results for ChatGPT
        if: success() && steps.preflight.outputs.skip_scan != 'true'
        env:
          PYTHONUTF8: "1"
        run: |
          git checkout -B main
          git pull --rebase origin main
          mkdir -p scan-results/latest
          cp data/market_scan.json scan-results/latest/market_scan.json
          cp data/candidates.csv scan-results/latest/candidates.csv
          cp data/news_sentiment.json scan-results/latest/news_sentiment.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("data/market_scan.json").read_text(encoding="utf-8"))
          manifest = {
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "event_name": os.environ.get("GITHUB_EVENT_NAME"),
              "source_commit": os.environ.get("GITHUB_SHA"),
              "collected_at": result.get("collected_at"),
              "scan_status": result.get("status"),
              "candidate_count": result.get("coverage", {}).get("candidate_count"),
              "history_success": result.get("coverage", {}).get("history_success"),
              "history_requested": result.get("coverage", {}).get("history_requested"),
              "news_status": result.get("news_data", {}).get("status"),
              "news_coverage": result.get("news_data", {}).get("coverage"),
          }
          Path("scan-results/latest/manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan-results/latest/market_scan.json scan-results/latest/candidates.csv scan-results/latest/news_sentiment.json scan-results/latest/manifest.json
          if git diff --cached --quiet; then
            echo "No scan-result changes to publish."
          else
            git commit -m "Publish A-share scan results"
            git push origin HEAD:main
          fi

      - name: Upload scan output
        if: always() && steps.preflight.outputs.skip_scan != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: a-share-market-scan
          path: |
            data/market_scan.json
            data/candidates.csv
            data/news_sentiment.json
          if-no-files-found: warn
          retention-days: 30
