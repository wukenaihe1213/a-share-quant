name: Multi-source failover fault-injection test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a-share-failover-fault-injection
  cancel-in-progress: false

jobs:
  failover-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTHONUTF8: "1"
        run: |
          python -m unittest discover -s tests -v

      - name: Inject live-quote outages and verify Tencent takeover
        env:
          PYTHONUTF8: "1"
        run: |
          python -m src.failover_smoke_test

      - name: Upload failover report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: multi-source-failover-report
          path: data/failover_smoke_test.json
          if-no-files-found: warn
          retention-days: 14
