name: AKShare connectivity smoke test

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Six-digit A-share code to test"
        required: true
        default: "000001"
        type: string

permissions:
  contents: read

concurrency:
  group: akshare-smoke-test
  cancel-in-progress: false

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AKShare connectivity test
        env:
          PYTHONUTF8: "1"
          STOCK_SYMBOL: ${{ inputs.symbol }}
        run: |
          python -m src.akshare_smoke_test --symbol "$STOCK_SYMBOL"

      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akshare-smoke-test
          path: data/smoke_test.json
          if-no-files-found: warn
          retention-days: 7
